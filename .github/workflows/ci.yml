name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Runtime Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit runtime dependencies with pip-audit
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --upgrade pip pip-audit
          .audit-venv/bin/pip install --no-cache-dir -e .
          .audit-venv/bin/pip-audit --skip-editable --progress-spinner off

  docker-build:
    name: Docker Image Build & Non-Root Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t cortex-mcp:ci .
      - name: Verify non-root container & package import
        run: docker run --rm --entrypoint python cortex-mcp:ci -c "import os, cortex_mcp; assert os.geteuid() != 0"

  test-and-benchmark:
    name: Python ${{ matrix.python-version }} (Lint + Typecheck + Test + Benchmark)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint & Mypy static type-check gates
        run: |
          ruff check .
          mypy src/cortex_mcp api

      - name: Run Pytest suite with coverage
        run: |
          pytest -v --cov=cortex_mcp --cov-report=term-missing --cov-fail-under=85

      - name: Run CLI multi-session memory demo
        run: |
          python -m cortex_mcp.cli demo

      - name: Run reproducible benchmark suite
        run: |
          python -m cortex_mcp.cli benchmark
