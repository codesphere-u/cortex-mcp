name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test-and-benchmark:
    name: Python ${{ matrix.python-version }} (Lint + Typecheck + Test + Benchmark)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff lint & Mypy static type-check gates
        run: |
          ruff check .
          mypy src/cortex_mcp api

      - name: Run Pytest suite with coverage
        run: |
          pytest -v --cov=cortex_mcp --cov-report=term-missing --cov-fail-under=85

      - name: Run CLI multi-session memory demo
        run: |
          python -m cortex_mcp.cli demo

      - name: Run reproducible benchmark suite
        run: |
          python -m cortex_mcp.cli benchmark
