[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-bitemporal-mcp"
version = "1.1.0"
description = "Local-First Bi-Temporal Knowledge Graph, Cross-Agent Persistent Memory & Token-Budgeted Context Compiler MCP Server for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Akandwanaho Ivan Alvin", email = "codesphere-u@users.noreply.github.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "agent-memory",
    "knowledge-graph",
    "context-engineering",
    "bitemporal",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
cortex-mcp = "cortex_mcp.cli:main"
cortex-bitemporal-mcp = "cortex_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/codesphere-u/cortex-mcp"
Repository = "https://github.com/codesphere-u/cortex-mcp"
Issues = "https://github.com/codesphere-u/cortex-mcp/issues"
Changelog = "https://github.com/codesphere-u/cortex-mcp/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
