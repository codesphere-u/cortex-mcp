[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortex-bitemporal-mcp"
version = "1.1.0"
description = "Local-First Bi-Temporal Knowledge Graph, Cross-Agent Persistent Memory & Token-Budgeted Context Compiler MCP Server for AI Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Akandwanaho Ivan Alvin", email = "codesphere-u@users.noreply.github.com"}
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai-agents",
    "agent-memory",
    "knowledge-graph",
    "context-engineering",
    "bitemporal",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.162.2",
    "pydantic>=2.14.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "mypy>=1.11.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.17.4",
]

[project.scripts]
cortex-mcp = "cortex_mcp.cli:main"
cortex-bitemporal-mcp = "cortex_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cortex_mcp = ["py.typed"]

[project.urls]
Homepage = "https://github.com/codesphere-u/cortex-mcp"
Repository = "https://github.com/codesphere-u/cortex-mcp"
Issues = "https://github.com/codesphere-u/cortex-mcp/issues"
Changelog = "https://github.com/codesphere-u/cortex-mcp/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.vercel]
entrypoint = "api.index:app"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
files = ["src/cortex_mcp", "api"]

[tool.coverage.run]
source = ["src/cortex_mcp"]

[tool.coverage.report]
show_missing = true
fail_under = 85

